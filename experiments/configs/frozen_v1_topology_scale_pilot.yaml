{
  "suite": "frozen_v1_topology_scale_pilot",
  "protocol_version": "frozen-v1",
  "build_command": ["cargo", "build", "--release"],
  "binary": "target/release/topostake",
  "max_parallel": 1,
  "timeout_seconds": 3600,
  "seeds": [0],
  "defaults": {
    "run_revision": "topology-scale-pilot-v1",
    "node_num": 100,
    "sybil_node_num": 0,
    "fake_node_num": 0,
    "unstable_node_num": 0,
    "topology": "ba",
    "tx_rate": 20,
    "stake_gini": 0.6,
    "transaction_fee": 0.001,
    "base_reward": 0.1,
    "slot_duration": 1,
    "slot_per_epoch": 5,
    "max_epochs": 20,
    "warmup_epochs": 5,
    "max_tx_per_block": 80,
    "time_scale": 0.02,
    "topostake_target_depth": 4,
    "beta": 0.8,
    "topostake_saturation_k": 1.0,
    "topostake_score_cost_reference": 0.00001,
    "topostake_score_floor_kappa": 1.0,
    "topostake_bonus_zeta": 1.0,
    "eta": 0.5,
    "bonus_cap": 1.0,
    "proposer_fee_ratio": 0.5,
    "reward_settlement_depth": 2,
    "topostake_score_activation_delay_epochs": 2,
    "topostake_max_path_hops": 16,
    "topostake_evidence_work_limit": 4096,
    "topostake_challenge_work_limit": 1024,
    "relay_profile": "active",
    "attack_tx_rate_multiplier": 0
  },
  "experiments": [
    {
      "name": "topology_scale_organic_capture",
      "protocols": ["topostake"],
      "node_num": [100, 1000],
      "topology": ["ba", "eth_empirical"],
      "adversary_stake_fraction": [0.1, 0.3],
      "adversary_placement": ["random", "high-degree"],
      "attack_mode": ["none", "max-score"]
    }
  ]
}
